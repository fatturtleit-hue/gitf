# Nginx reverse proxy for gitf
# Copy to: /etc/nginx/sites-available/gitf.conf
# Enable:  ln -s /etc/nginx/sites-available/gitf.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name gitf.example.com;  # Replace with your domain or server IP

    # Increase body size for git push
    client_max_body_size 100m;

    # Protect metrics endpoint
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # Main proxy
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Git operations need longer timeouts
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
