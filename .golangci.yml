# gitf golangci-lint configuration
# See: https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  enable:
    - errcheck        # unchecked errors
    - govet           # Go vet
    - staticcheck     # static analysis
    - gosimple        # simplification suggestions
    - unused          # unused code
    - ineffassign     # ineffective assignments
    - gocritic        # idiomatic Go checks
    - misspell        # spelling mistakes
    - goimports       # import formatting
    - gofmt           # code formatting
    - gci             # import grouping
    - gocyclo         # cyclomatic complexity
    - gosec           # security scanner
    - bodyclose       # HTTP body not closed
    - sqlclosecheck   # SQL rows/stmt not closed
    - prealloc        # slice preallocation suggestions
    - exportloopref   # loop variable references
    - nilerr          # nil error returns
    - noctx           # http request without context
    - rowserrcheck    # rows.Err not checked
    - unconvert       # unnecessary type conversions
    - unparam          # unused function parameters
    - wastedassign    # wasted assignments

  disable:
    - funlen          # we allow moderately long functions
    - gomnd           # magic number detector (too noisy)
    - lll             # line length (prettier handles this for TS, gofmt for Go)
    - godox           # we track TODOs separately via debt-report.sh
    - depguard        # we manage deps via dependabot
    - forbidigo       # we don't need to forbid specific patterns
    - tagalign        # struct tag alignment (cosmetic)
    - exhaustive      # exhaustive switch (too strict for our use case)
    - wrapcheck       # error wrapping check (handled by code review)

linters-settings:
  gocyclo:
    min-complexity: 15
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
  misspell:
    locale: US
  gosec:
    severity: medium
    confidence: medium
  gci:
    sections:
      - standard
      - default
      - prefix(gitf)
      - blank
      - dot
  goimports:
    local-prefixes: gitf

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck    # deferred Close in tests is intentional
        - gosec       # test files often have intentional weaknesses
        - bodyclose
    - path: internal/web/
      linters:
        - all
    - path: cmd/server/
      linters:
        - forbidigo    # main package can use fmt.Print, os.Exit etc.

  max-issues-per-linter: 0
  max-same-issues: 0

output:
  sort-results: true
  print-linter-name: true

run:
  timeout: 5m
  concurrency: 4
